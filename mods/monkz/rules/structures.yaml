MONASTERY:
	Inherits: ^Building
	
	Valued:
		Cost: 1000
	
	Tooltip:
		Name: actor-monastery.name
	
	Selectable:
		Class: MONASTERY
	
	Building:
		Footprint: xxxxx xxxxx =====
		Dimensions: 5,3
		LocalCenterOffset: 0,-512,0
		TerranTypes: Clear, Road

	Health:
		HP: 1000

	Armor:
		Type: Wood

	RevealsShroud:
		Range: 6c0

	RenderSprites:
		Image: monastery
		PlayerPalette: player

	BaseBuilding:

	Refinery:
		UseStorage: false
		ShowTicks: false

	DockHost:
		Type: Unload
		DockOffset: 0,1024,0

	RallyPoint:
		ForceSetType: Monk
	
	Exit@1:
		ExitCell: 2,2
		ProductionTypes: Monk, Infantry

	Production:
		Produces: Infantry, Monk

	ProductionBar:
		ProductionType: Infantry

	ProvidesPrerequisite@monastery:
		Prerequisite: monastery

	-SpawnActorsOnSell:

	SpawnActorOnDeath:
		Actor: MONASTERY.RUBBLE

MONASTERY.RUBBLE:
	Inherits: ^SpriteActor

	RenderSprites:
		Image: monastery

	WithSpriteBody:
		Sequence: rubble

	Immobile:
		OccupiesSpace: false